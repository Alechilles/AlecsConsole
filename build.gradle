plugins {
    id 'java'
    id 'com.azuredoom.hytale-tools'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.alechilles'
def localProperties = new Properties()
file('gradle.properties').withInputStream { localProperties.load(it) }
def property = { String name -> providers.gradleProperty(name).getOrElse(localProperties.getProperty(name)) }
version = property('mod_version')
def beaconCoordinates = "com.alechilles:beacon-runtime:${property('beacon_version')}"
def embeddedAssetPackDirectory = layout.buildDirectory.dir('generated/embeddedAssetPack')

repositories {
    maven { url = uri('https://beacon.modstats.io/maven/releases') }
}

configurations {
    beaconAssetPack {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

sourceSets.main.resources.setSrcDirs([embeddedAssetPackDirectory])

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

hytaleTools {
    hytaleVersion = property('hytale_version')
    patchline = property('hytale_patchline')
    manifestServerVersion = '>=0.5.0 <0.7.0'
    manifestGroup = 'Alechilles'
    modId = "Alec's Console"
    modDescription = 'A responsive in-game viewer for live and historical Hytale logs.'
    modCredits = 'Alec (Alechilles)||https://www.curseforge.com/members/alechilles/projects'
    mainClass = 'com.alechilles.alecsconsole.AlecsConsolePlugin'
    curseforgeId = '1662323'
    includesPack = true
    bundleAssetEditorRuntime = false
    assetPackSourceDirectory = embeddedAssetPackDirectory
}

dependencies {
    implementation beaconCoordinates
    beaconAssetPack beaconCoordinates
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.register('prepareEmbeddedAssetPack', Sync) {
    description = 'Merges Console resources and Beacon consent UI for packaged and development use.'
    dependsOn(tasks.named('createManifestIfMissing'), tasks.named('updatePluginManifest'))
    from(layout.projectDirectory.dir('src/main/resources'))
    from({ configurations.beaconAssetPack.collect { zipTree(it) } }) {
        include 'Common/**'
    }
    into(embeddedAssetPackDirectory)
}

['classes', 'processResources', 'prepareRunServer'].each { taskName ->
    tasks.named(taskName) {
        dependsOn(tasks.named('prepareEmbeddedAssetPack'))
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    archiveFileName = "Alec's Console v${project.version}.jar"
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

configurations.named('testImplementation') {
    extendsFrom(configurations.compileOnly)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir projectDir
    systemProperty 'java.util.logging.manager', 'com.hypixel.hytale.logger.backend.HytaleLogManager'
}
